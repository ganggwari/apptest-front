<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d62"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/customer.webmanifest"><link rel="icon" href="/icons/customer-192.png"><title>ROUTEL 고객 앱 설치</title><style>body{margin:0;font:16px/1.65 system-ui,sans-serif;background:#f1f5f9;color:#18344d}main{max-width:420px;margin:8vh auto;padding:25px}section{background:white;padding:25px;border-radius:18px;box-shadow:0 6px 22px #102a4315}button,a{width:100%;display:block;box-sizing:border-box;margin-top:16px;padding:14px;border-radius:12px;background:#175c9e;color:white;border:0;text-align:center;text-decoration:none;font:inherit}p{color:#516577}small{color:#516577}button:disabled{opacity:.6}</style></head><body><main><section><h2>ROUTEL 고객 앱 설치</h2><p>주소창 없이 실행하려면 Chrome에서 이 앱을 설치해야 해요. 기존에 주소창이 뜨던 바로가기는 삭제한 뒤 이 페이지에서 새로 설치해 주세요.</p><button id="install" hidden>ROUTEL 고객 앱 설치</button><p id="hint">Chrome 메뉴(⋮) → 앱 설치 또는 홈 화면에 추가를 선택하세요. 설치가 아닌 단순 바로가기로 만들어지면 주소창이 표시될 수 있어요.</p><a href="/customer-app/screen-1?pwa=customer">고객 앱 화면 열기</a><small>설치 후 처음 로그인하면 푸시 알림 허용 안내가 바로 나와요.</small><small>이미 설치된 앱은 홈 화면 아이콘으로 실행해야 독립형으로 열립니다.</small></section></main><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(console.warn);let deferred;const btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});btn.onclick=async()=>{if(!deferred)return;await deferred.prompt();const choice=await deferred.userChoice;deferred=null;btn.hidden=true;document.getElementById('hint').textContent=choice.outcome==='accepted'?'설치 요청 완료! 홈 화면에 추가된 앱 아이콘을 실행하세요.':'설치를 취소했어요. Chrome 메뉴에서 다시 설치할 수 있어요.'};window.addEventListener('appinstalled',()=>{btn.hidden=true;document.getElementById('hint').textContent='설치 완료! 홈 화면 아이콘으로 실행하세요.'});if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)){const h=document.getElementById('hint');h.innerHTML='<b>iPhone·iPad는 버튼 설치가 없어요.</b><br>1. <b>Safari</b>로 여세요 (카카오톡 등 다른 앱 안의 브라우저는 안 돼요).<br>2. 아래 <b>앱 화면 열기</b>를 눌러 앱 첫 화면으로 간 다음, 그 화면에서 <b>공유 버튼(네모에서 화살표가 나온 모양)</b>을 누르세요. iPad는 주소창 오른쪽 위에 있어요.<br>3. 메뉴에서 <b>홈 화면에 추가</b> → <b>추가</b>를 누르세요.<br>4. 홈 화면의 ROUTEL 아이콘으로 실행하세요. 알림은 앱 아이콘으로 연 다음 로그인할 때 허용할 수 있어요.';if(window.navigator.standalone)h.textContent='이미 홈 화면 앱으로 실행 중이에요.'}</script></body></html>
